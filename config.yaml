# Stage 1 tracking and open-field metrics

detector:
  weights: models/mouse_det_v2.pt   # YOLO11n (KUNIN mouse backbone), fine-tuned on YSMU + 6 Sturman videos
  imgsz: 352                         # arena crop is ~360 px, so the mouse stays near native resolution
  conf: 0.25
  batch: 16

tracking:
  max_speed_cm_s: 100     # faster apparent moves are detection errors and are dropped
  max_gap_s: 0.5          # gaps up to this long are interpolated; longer gaps stay missing
  smooth_s: 0             # rolling-median window on the path; 0 = off (the validated comparison is unsmoothed)
  hand_foreground_px: 2500  # more changed pixels than this in the arena = experimenter's hand in view

# DLCAnalyzer rules (validated on Sturman et al.), reported with ANY-maze style names
open_field:
  movement_cutoff_cm_s: 5       # a frame is "moving" above this speed ...
  integration_period_frames: 5  # ... after a +-5 frame majority vote; zone transitions use the same smoothing
  immobile_min_s: 2             # an immobile episode is not moving for at least this long
  max_speed_min_cm: 2           # max speed is measured over at least this much path (ignores jitter)
  anymaze_min_move_cm: 4        # "ANY-maze style" distance counts a move only after this much displacement (fitted on 1 YSMU video)
  corner_fraction: 0.2          # corner zones: squares this fraction of the arena side
  bin_s: 60                     # time bins for the per-minute table

# Defaults for a new setup (all editable in the UI)
defaults:
  width_cm: 40
  height_cm: 40
  grid_cm: 10
  center_mode: percent
  center_value: 50
