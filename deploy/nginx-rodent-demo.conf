# nginx site for the RodentTracker demo. setup_droplet.sh replaces RODENT_DOMAIN, installs it as
# /etc/nginx/sites-available/rodent-demo, then certbot --nginx adds HTTPS (same as the other sites).
server {
    listen 80;
    server_name RODENT_DOMAIN;
    client_max_body_size 200M;        # video uploads; nginx's default 1 MB refuses any video

    location / {
        proxy_pass http://127.0.0.1:8013;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;  # uploads go straight to the app
        proxy_read_timeout 300s;      # PDF report and the first analysis of a long video take a while
    }
}
